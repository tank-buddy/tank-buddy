name: Release

on:
  release:
    types: [created]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install MicroPython stubs
        run: make stubs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web-ui

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web-ui

      - name: Lint, typecheck and test everything
        run: make check-all

      - name: Build
        run: make build

      - name: Archive build output
        run: |
          VERSION=${{ github.ref_name }}
          tar -czvf tank-buddy-${VERSION}.tar.gz ./dist

      - name: Upload release asset with gh cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "tank-buddy-${GITHUB_REF_NAME}.tar.gz" --repo "$GITHUB_REPOSITORY"
