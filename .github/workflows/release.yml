name: Release

# semantic-release decides whether a push warrants a release and what to call
# it, so this runs on every push to main and usually does nothing. `build(deps)`
# from Dependabot is not a releasable type, so a week of dependency updates does
# not produce a release.
#
# The version is worked out *before* the builds because UI_VERSION is compiled
# into the web UI, and the device compares that value against the version in the
# published bundle -- get them out of step and every device offers an update
# forever. That is why there is a separate `version` job rather than a single
# semantic-release run at the end.
#
# It also cannot be split across workflows: a release created with the automatic
# GITHUB_TOKEN starts no workflow run (GitHub's recursion guard), so triggering
# the builds from the release event would leave every release without assets.
# The jobs are chained with `needs` instead, which needs no extra token.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Work out the version and build everything, publish nothing
        type: boolean
        default: true

# Read for the building jobs; the publish job widens this for itself. The
# repository default is read-only, so without this semantic-release cannot
# create the release at the very last step.
permissions:
  contents: read

env:
  MICROPYTHON_VERSION: v1.28.0

# The firmware job runs inside the Espressif image, which carries no gh CLI, so
# every job hands its output to `publish` as an artifact rather than uploading
# to the release itself.
jobs:
  version:
    name: Work out whether this warrants a release
    permissions:
      # Needed even though this job publishes nothing. semantic-release verifies
      # push access in its core with a real `git push --dry-run` -- before any
      # plugin loads, and regardless of its own --dry-run flag -- so a job that
      # only works out a number still has to be allowed to push.
      contents: write
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.next.outputs.published }}
      # The git tag (`v1.2.3`), not the bare version: it is what the release is
      # named, what the update bundle records and what the running UI compares
      # itself against.
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # semantic-release reads every commit since the last tag; a shallow
          # clone makes it see one and release the wrong version.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      # --dry-run stops before `prepare`, so nothing is written, tagged or
      # pushed here. verifyReleaseCmd still runs, which is what produces the
      # file below; it is absent when no release is due.
      - name: Ask semantic-release for the next version
        id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          pnpm exec semantic-release --dry-run
          if [ -f .release-version ]; then
            cat .release-version >> "$GITHUB_OUTPUT"
            cat .release-version
          else
            # Either nothing releasable since the last tag, or this is a manual
            # run from a branch semantic-release does not publish from. It says
            # which in the output above; do not guess at it here.
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "nothing to release from this run -- see the log above"
          fi

  web-ui:
    name: Build the web UI and its update bundle
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install MicroPython stubs
        run: make stubs

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint, typecheck and test everything
        run: make check-all

      # UI_VERSION is what the update panel displays and compares against the
      # published bundle, so it has to be the tag rather than a build number --
      # and the same value in both places, or the comparison never matches.
      # There is no tag yet at this point, which is why it comes from the
      # version job rather than from github.ref_name.
      - name: Build
        run: make build
        env:
          UI_VERSION: ${{ needs.version.outputs.tag }}

      - name: Pack the update bundle
        run: |
          uv run python tools/build_web_ui_bundle.py \
            web/apps/device-ui/dist "${{ needs.version.outputs.tag }}" \
            release-assets/web-ui.json

      # Everything the device serves from its filesystem -- the same tree a
      # manual `mpremote fs cp -r dist/. :` would push.
      - name: Archive the device filesystem
        run: tar -czf release-assets/tank-buddy-filesystem.tar.gz -C dist .

      - name: Hand the assets to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release-web-ui
          path: release-assets
          retention-days: 1

      # The built interface itself, which the publish job turns into the
      # filesystem half of the one-file flash images.
      - name: Hand the built interface to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: web-ui-dist
          path: web/apps/device-ui/dist
          retention-days: 1

  firmware:
    name: Build firmware (${{ matrix.board }})
    # Deliberately not given the version: manifest.py freezes src/, which
    # carries no version number. Only the interface does.
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors ci.yml. See boards/README.md for which chips are here and why.
        board:
          - TANKBUDDY_ESP32
          - TANKBUDDY_S2
          - TANKBUDDY_S3
          - TANKBUDDY_C3
          - TANKBUDDY_C6
    container:
      image: espressif/idf:v5.5.1
      options: --user 0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Cache MicroPython checkout and mpy-cross
        uses: actions/cache@v6
        id: micropython-cache
        with:
          path: micropython
          key: micropython-${{ env.MICROPYTHON_VERSION }}-${{ runner.os }}

      - name: Clone MicroPython
        if: steps.micropython-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$MICROPYTHON_VERSION" https://github.com/micropython/micropython.git
          git -C micropython submodule update --init --depth 1 --recursive

      - name: Compile mpy-cross
        if: steps.micropython-cache.outputs.cache-hit != 'true'
        run: make -C micropython/mpy-cross

      - name: Build Firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          make -C micropython/ports/esp32 \
            BOARD_DIR="$GITHUB_WORKSPACE/boards/${{ matrix.board }}" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/manifest.py"

      - name: Name the image after its board
        run: |
          mkdir -p release-assets
          cp "micropython/ports/esp32/build-${{ matrix.board }}/firmware.bin" \
             "release-assets/tank-buddy-${{ matrix.board }}.bin"

      - name: Hand the image to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release-firmware-${{ matrix.board }}
          path: release-assets
          retention-days: 1

      - name: Keep the build tree out of the cache
        if: always() && steps.micropython-cache.outputs.cache-hit != 'true'
        run: rm -rf micropython/ports/esp32/build-${{ matrix.board }}

  publish:
    name: Merge the flash images and cut the release
    runs-on: ubuntu-latest
    needs: [version, web-ui, firmware]
    # A manual run defaults to publishing nothing, so the whole chain can be
    # exercised on a branch without cutting a release.
    if: >-
      needs.version.outputs.published == 'true' &&
      inputs.dry_run != true
    permissions:
      # The one job that tags and releases.
      contents: write
      # @semantic-release/github does more than publish. Its `success` step
      # comments on and labels the pull requests a release contains, and its
      # `fail` step opens an issue when a release breaks -- all of which is on by
      # default (successComment, releasedLabels). Without these two the release
      # itself would succeed and the run would go red immediately afterwards.
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Same reason as the version job: semantic-release needs the history,
          # and it pushes the changelog commit from here.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Collect every job's output
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Collect the built interface
        uses: actions/download-artifact@v8
        with:
          name: web-ui-dist
          path: web-ui-dist

      # Merging needs neither the IDF nor a board, only Python and esptool, so
      # it happens here rather than five times inside the Espressif container.
      - name: Build the filesystem image
        run: uv run python tools/build_littlefs_image.py web-ui-dist littlefs.bin

      # Two artefacts per board, and the difference matters to whoever flashes
      # them: `-full` writes the whole chip, interface included, and takes
      # /settings.json with it -- a first install or a factory reset. The plain
      # firmware image leaves the filesystem alone, so an existing device keeps
      # both its configuration and its interface.
      - name: Merge one flashable file per board
        run: |
          set -eu
          declare -A chips=(
            [TANKBUDDY_ESP32]=esp32
            [TANKBUDDY_S2]=esp32s2
            [TANKBUDDY_S3]=esp32s3
            [TANKBUDDY_C3]=esp32c3
            [TANKBUDDY_C6]=esp32c6
          )
          for board in "${!chips[@]}"; do
            uv run esptool --chip "${chips[$board]}" merge-bin \
              -o "release-assets/tank-buddy-${board}-full.bin" --flash-size 4MB \
              0x0 "release-assets/tank-buddy-${board}.bin" \
              0x200000 littlefs.bin
          done
          ls -la release-assets

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      # Everything at once, and only now that the assets exist: tag, GitHub
      # release with those assets attached, CHANGELOG.md, the version in
      # pyproject.toml, and the release commit pushed back to main. That push
      # uses GITHUB_TOKEN, so it starts no workflow run and cannot loop.
      #
      # SEMANTIC_RELEASE_PUBLISH is what adds the plugins that write; see
      # release.config.mjs. Without it this run would analyse and stop.
      - name: Tag, release and attach the assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_RELEASE_PUBLISH: 'true'
        run: pnpm exec semantic-release

  # Republishes the installer and the update bundle for the release just cut.
  # Called rather than triggered -- see the note at the top of pages.yml.
  pages:
    name: Deploy the browser installer
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
