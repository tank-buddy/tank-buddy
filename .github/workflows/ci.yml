name: CI

on:
  pull_request

env:
  MICROPYTHON_VERSION: v1.26.0

jobs:
  core:
    name: Lint, typecheck and test (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install MicroPython stubs
        run: make stubs

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

  web-ui:
    name: Lint, test and build (web UI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned rather than read from engines.node (">=22.12"), which would
          # float onto whatever Node is newest.
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser-mode tests need a real Chromium; the download is the slow part,
      # so it is cached on the resolved Playwright version.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm ls playwright --json | jq -r '.[0].devDependencies.playwright.version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    # Only `core` gates this: manifest.py freezes src/ alone, so the web UI is
    # not part of the firmware image and would only serialise the pipeline.
    needs: [core]
    container:
      image: espressif/idf:release-v5.2
      options: --user 0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Cloning MicroPython with recursive submodules and compiling mpy-cross
      # from source dominated the pipeline; both depend only on the version.
      - name: Cache MicroPython checkout and mpy-cross
        uses: actions/cache@v4
        id: micropython-cache
        with:
          path: micropython
          key: micropython-${{ env.MICROPYTHON_VERSION }}-${{ runner.os }}

      - name: Clone MicroPython
        if: steps.micropython-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$MICROPYTHON_VERSION" https://github.com/micropython/micropython.git
          git -C micropython submodule update --init --depth 1 --recursive

      - name: Compile mpy-cross
        if: steps.micropython-cache.outputs.cache-hit != 'true'
        run: make -C micropython/mpy-cross

      - name: Build Firmware
        run: make -C micropython/ports/esp32 BOARD=ESP32_GENERIC_C6 FROZEN_MANIFEST=../../../manifest.py

      - name: Archive and upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tank-buddy
          path: micropython/ports/esp32/build-ESP32_GENERIC_C6/firmware.bin
          retention-days: 7
