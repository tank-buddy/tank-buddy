name: CI

on:
  pull_request

jobs:
  continous-integration:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up docker buildx
      uses: docker/setup-buildx-action@v3

    - name: Build docker images
      run: make docker-build-images
      continue-on-error: false

    - name: Install dependencies
      run: make docker-install
      continue-on-error: false

    - name: Run ruff & biomejs (linting)
      run: make docker-lint
      continue-on-error: false

    - name: Run tests
      run: make docker-test
      continue-on-error: false

    - name: Build web-ui
      run: make docker-build-web-ui
      continue-on-error: false

  build:
    runs-on: ubuntu-latest
    needs: continous-integration

    steps:
      - name: Install mkcert
        run: |
          sudo apt update
          sudo apt install -y mkcert libnss3-tools

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create self signed cert
        run: make create-self-signed-certificate

      - name: Clone MicroPython
        run: |
          git clone -b v1.26.0 https://github.com/micropython/micropython.git
          git -C micropython submodule update --init --recursive

      - name: Setup ESP-IDF
        run: |
          git clone -b v5.2.1 --recursive https://github.com/espressif/esp-idf.git
          ./esp-idf/install.sh
          echo "source $PWD/esp-idf/export.sh" >> $GITHUB_ENV

      - name: Compile mpy-cross
        run: |
          cd micropython/mpy-cross
          make

      - name: Build Firmware
        run: |
          source esp-idf/export.sh
          cd micropython/ports/esp32
          make BOARD=ESP32_GENERIC_C6 FROZEN_MANIFEST=../../../manifest.py

      - name: Archive and upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tank-buddy
          path: micropython/ports/esp32/build-ESP32_GENERIC_C6/firmware.bin
          retention-days: 7