name: CI

on:
  pull_request

# Nothing here writes to the repository, and the org default is read-only
# anyway. Stated explicitly so a change to that default cannot silently widen
# what these jobs may do.
permissions:
  contents: read

# One run per pull request. Pushing again supersedes the previous run rather than
# racing it, which also means a hung run stops costing minutes the moment the
# next commit arrives -- there is no point in the old one finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MICROPYTHON_VERSION: v1.28.0

jobs:
  core:
    name: Lint, typecheck and test (Python)
    runs-on: ubuntu-latest
    # The default is 360 minutes. Nothing here takes more than a couple, so a job
    # sitting for a quarter of an hour is stuck, not slow -- and should say so
    # rather than hold a required check open for six hours.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install MicroPython stubs
        run: make stubs

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

  web:
    name: Lint, test and build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Pinned rather than read from engines.node (">=22.12"), which would
          # float onto whatever Node is newest.
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser-mode tests need a real Chromium; the download is the slow part,
      # so it is cached on the resolved Playwright version.
      #
      # `--filter` is load-bearing in both steps below. Playwright belongs to the
      # device UI, not to the workspace root, so a bare `pnpm ls` reports the root
      # package as `.[0]` -- which has no playwright -- and yields `null`. That
      # produced an empty cache key, a guaranteed miss, and then a `pnpm exec`
      # that could not resolve playwright at all.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter @tank-buddy/device-ui ls playwright --json \
            | jq -r '.[0].devDependencies.playwright.version')
          test -n "$version" && test "$version" != null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # No `install-deps` companion for the cache-hit path. There used to be one,
      # on the assumption that a cache hit skips the system libraries -- but the
      # cache holds ~/.cache/ms-playwright, i.e. browser binaries, while the
      # libraries come from the runner image, which ships google-chrome-stable
      # and therefore all of them already. So it was a no-op that ran apt-get,
      # and the first time it ever executed (the cache was cold until then) an
      # unreachable azure.archive.ubuntu.com mirror made it retry into long
      # timeouts and hang for 20 minutes. If a library really is missing one day,
      # the browser tests fail immediately and say which -- better than that.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: >-
          pnpm --filter @tank-buddy/device-ui exec
          playwright install --with-deps chromium

      # One formatting pass for the whole workspace: one Prettier config, shared
      # from web/packages/prettier-config.
      - name: Format check
        run: pnpm run format:check

      # `-r` covers both apps. The config packages have no scripts and are
      # skipped, but a third app would be picked up without touching this file.
      - name: Lint
        run: pnpm -r run lint

      - name: Typecheck
        run: pnpm -r run typecheck

      # Only the device UI has tests; the installer is a static page whose one
      # behaviour (fetch the manifest, reveal the button) needs a browser and a
      # board to mean anything.
      - name: Test
        run: pnpm --filter @tank-buddy/device-ui test

      # Both, because a broken installer build should fail here rather than
      # during a release.
      - name: Build
        run: pnpm -r run build

  firmware:
    name: Build firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    # Higher than the others: a cold cache means cloning MicroPython with
    # submodules and compiling mpy-cross before the firmware itself.
    timeout-minutes: 45
    strategy:
      # One board failing to fit or compile is worth knowing about for all of
      # them, so the matrix runs to completion.
      fail-fast: false
      matrix:
        # Every chip MicroPython ships a generic board for that also has Wi-Fi.
        # H2 has none, the C2 is too small for this application, ESP8266 is a
        # separate port, and the P4 needs a companion radio.
        #
        # S2 and S3 were out under v1.26.0, which pinned espressif/esp_tinyusb
        # ~1.0.0 and would not compile against the TinyUSB in IDF v5.4.2.
        # v1.28.0 replaced that dependency with MicroPython's own fork.
        board:
          - TANKBUDDY_ESP32
          - TANKBUDDY_S2
          - TANKBUDDY_S3
          - TANKBUDDY_C3
          - TANKBUDDY_C6
    # Only `core` gates this: manifest.py freezes src/ alone, so the web UI is
    # not part of the firmware image and would only serialise the pipeline.
    needs: [core]
    container:
      # The version ports/esp32/README.md names as recommended for this
      # MicroPython release. This tag and MICROPYTHON_VERSION are two halves of
      # one decision: bump them together or the toolchain and the port drift
      # apart.
      image: espressif/idf:v5.5.1
      options: --user 0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Cloning MicroPython with recursive submodules and compiling mpy-cross
      # from source dominated the pipeline; both depend only on the version.
      - name: Cache MicroPython checkout and mpy-cross
        uses: actions/cache@v6
        id: micropython-cache
        with:
          path: micropython
          key: micropython-${{ env.MICROPYTHON_VERSION }}-${{ runner.os }}

      - name: Clone MicroPython
        if: steps.micropython-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$MICROPYTHON_VERSION" https://github.com/micropython/micropython.git
          git -C micropython submodule update --init --depth 1 --recursive

      - name: Compile mpy-cross
        if: steps.micropython-cache.outputs.cache-hit != 'true'
        run: make -C micropython/mpy-cross

      - name: Build Firmware
        # A container job overrides the image's entrypoint, so the IDF
        # environment is never exported and idf.py is not on PATH. Sourcing it
        # here needs bash; the default shell in a container job is `sh -e`.
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          # Both paths must be absolute. A relative FROZEN_MANIFEST looks right
          # next to `make -C`, but makemanifest.py is invoked by ninja from
          # build-*/esp-idf/main, so `../../../manifest.py` resolved to
          # ports/esp32/manifest.py and the freeze step failed.
          make -C micropython/ports/esp32 \
            BOARD_DIR="$GITHUB_WORKSPACE/boards/${{ matrix.board }}" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/manifest.py"

      # Named per board, and "firmware" rather than the project name: this image
      # holds src/ frozen in, but not the web UI, which is a filesystem asset.
      # It is a build check, not something to hand to a user.
      - name: Archive and upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: micropython/ports/esp32/build-${{ matrix.board }}/firmware.bin
          retention-days: 7

      # The cache key only carries the MicroPython version, so whatever is on
      # disk at the end of a cache-miss run is what every later run restores.
      # Keeping the ESP32 build tree in there would pin ~1 GB of object files
      # from one commit under a key that never changes again.
      - name: Keep the build tree out of the cache
        if: always() && steps.micropython-cache.outputs.cache-hit != 'true'
        run: rm -rf micropython/ports/esp32/build-${{ matrix.board }}

  # One check to require in the branch ruleset, so the rule survives the board
  # matrix changing. Requiring each matrix job by name pins the rule to today's
  # chip list: drop a board and `main` waits forever for a check that will never
  # report again.
  #
  # `if: always()` is load-bearing. Without it a failed dependency leaves this
  # job skipped, and GitHub counts a skipped required check as satisfied -- so a
  # red pull request would become mergeable. It therefore runs regardless and
  # decides for itself.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [core, web, firmware]
    if: always()

    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "core=${{ needs.core.result }}"
          echo "web=${{ needs.web.result }}"
          echo "firmware=${{ needs.firmware.result }}"
          exit 1
